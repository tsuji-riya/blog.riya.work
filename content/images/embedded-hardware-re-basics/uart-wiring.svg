<path d="M210,112 C300,112 260,112 350,112" fill="none" stroke="#2b2b2b" stroke-width="3"/>
<path d="M210,156 C300,156 260,200 350,200" fill="none" stroke="#2f6fb0" stroke-width="3"/>
