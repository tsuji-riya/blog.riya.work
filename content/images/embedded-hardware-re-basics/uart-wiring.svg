<path d="M271.0,235 L289.0,253 M289.0,235 L271.0,253" stroke="#d1495b" stroke-width="3.5"/>
<text x="280.0" y="270" text-anchor="middle" font-size="13" fill="#d1495b" font-weight="700">VCC はつながない</text>
