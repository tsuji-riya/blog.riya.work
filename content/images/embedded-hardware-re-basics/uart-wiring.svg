<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 300" width="560" font-family="'Source Sans Pro','Hiragino Sans','Noto Sans JP',sans-serif">
<rect x="0.5" y="0.5" width="559" height="299" rx="10" fill="#ffffff" stroke="#e0e0e0"/>
