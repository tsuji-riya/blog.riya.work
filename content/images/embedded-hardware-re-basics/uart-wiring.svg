<circle cx="350" cy="112" r="5" fill="#2b2b2b"/>
<text x="362" y="117" text-anchor="start" font-size="15" fill="#2b2b2b" font-weight="700">GND</text>
<circle cx="350" cy="156" r="5" fill="#2b2b2b"/>
<text x="362" y="161" text-anchor="start" font-size="15" fill="#2b2b2b" font-weight="700">TX</text>
<circle cx="350" cy="200" r="5" fill="#2b2b2b"/>
<text x="362" y="205" text-anchor="start" font-size="15" fill="#2b2b2b" font-weight="700">RX</text>
