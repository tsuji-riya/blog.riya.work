<circle cx="210" cy="112" r="5" fill="#2b2b2b"/>
<text x="198" y="117" text-anchor="end" font-size="15" fill="#2b2b2b" font-weight="700">GND</text>
<circle cx="210" cy="156" r="5" fill="#2b2b2b"/>
<text x="198" y="161" text-anchor="end" font-size="15" fill="#2b2b2b" font-weight="700">TX</text>
<circle cx="210" cy="200" r="5" fill="#2b2b2b"/>
<text x="198" y="205" text-anchor="end" font-size="15" fill="#2b2b2b" font-weight="700">RX</text>
<circle cx="210" cy="244" r="5" fill="#2b2b2b"/>
<text x="198" y="249" text-anchor="end" font-size="15" fill="#2b2b2b" font-weight="700">VCC</text>
<rect x="350" y="50" width="170" height="220" rx="8" fill="#f4f6f8" stroke="#c9d1d9"/>
