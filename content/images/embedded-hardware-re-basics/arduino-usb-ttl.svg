<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 330" width="600" font-family="'Source Sans Pro','Hiragino Sans','Noto Sans JP',sans-serif">
<rect x="0.5" y="0.5" width="599" height="329" rx="10" fill="#ffffff" stroke="#e0e0e0"/>
<text x="300.0" y="30" text-anchor="middle" font-size="17" font-weight="700" fill="#2b2b2b">Arduino を USB-TTL として使う配線</text>
<rect x="40" y="50" width="210" height="200" rx="8" fill="#f4f6f8" stroke="#c9d1d9"/>
<text x="145.0" y="76" text-anchor="middle" font-size="15" fill="#2b2b2b" font-weight="700">Arduino Uno</text>
<circle cx="250" cy="112" r="5" fill="#2b2b2b"/>
<text x="238" y="117" text-anchor="end" font-size="15" fill="#2b2b2b" font-weight="700">D0 (RX)</text>
<circle cx="250" cy="156" r="5" fill="#2b2b2b"/>
<text x="238" y="161" text-anchor="end" font-size="15" fill="#2b2b2b" font-weight="700">D1 (TX)</text>
<circle cx="250" cy="200" r="5" fill="#2b2b2b"/>
<text x="238" y="205" text-anchor="end" font-size="15" fill="#2b2b2b" font-weight="700">GND</text>
<rect x="400" y="50" width="170" height="200" rx="8" fill="#f4f6f8" stroke="#c9d1d9"/>
<text x="485.0" y="76" text-anchor="middle" font-size="15" fill="#2b2b2b" font-weight="700">機器の UART</text>
<circle cx="400" cy="112" r="5" fill="#2b2b2b"/>
<text x="412" y="117" text-anchor="start" font-size="15" fill="#2b2b2b" font-weight="700">RX</text>
<circle cx="400" cy="156" r="5" fill="#2b2b2b"/>
<text x="412" y="161" text-anchor="start" font-size="15" fill="#2b2b2b" font-weight="700">TX</text>
<circle cx="400" cy="200" r="5" fill="#2b2b2b"/>
<text x="412" y="205" text-anchor="start" font-size="15" fill="#2b2b2b" font-weight="700">GND</text>
<path d="M250,112 C340,112 310,112 400,112" fill="none" stroke="#2f6fb0" stroke-width="3"/>
<path d="M250,156 C340,156 310,156 400,156" fill="none" stroke="#3a8f5c" stroke-width="3"/>
<path d="M250,200 C340,200 310,200 400,200" fill="none" stroke="#2b2b2b" stroke-width="3"/>
<rect x="291.0" y="101" width="68" height="22" rx="4" fill="#fff4e5" stroke="#d9822b" stroke-width="2"/>
<text x="325.0" y="117" text-anchor="middle" font-size="13" fill="#d9822b" font-weight="700">分圧</text>
<rect x="50" y="214" width="190" height="26" rx="5" fill="#ffffff" stroke="#d1495b" stroke-width="2"/>
<text x="145" y="232" text-anchor="middle" font-size="12" fill="#d1495b" font-weight="700">RESET と GND をショート</text>
<text x="300.0" y="284" text-anchor="middle" font-size="13" fill="#6b6b6b" font-weight="400">ATmega をリセットで止めて、USB-シリアル変換チップだけを使う</text>
<text x="300.0" y="306" text-anchor="middle" font-size="13" fill="#6b6b6b" font-weight="400">シルクの RX/TX は ATmega から見た向きなので、つなぎ方はストレート</text>
</svg>
